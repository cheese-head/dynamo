# Default sweep: POSIX (libaio, uring) and GDS_MT with O_DIRECT enabled.
configs:
  - { nixl_posix_api: aio, remote_disk_o_direct: true, remote_disk_backend: posix, runtime_threads: 128 }
  - { nixl_posix_api: uring, remote_disk_o_direct: true, remote_disk_backend: posix, runtime_threads: 128 }
  - { remote_disk_backend: gds, remote_disk_o_direct: true, gds_threads: 4, runtime_threads: 128 }
  - { remote_disk_backend: gds, remote_disk_o_direct: true, gds_threads: 8, runtime_threads: 128 }
  - { remote_disk_backend: gds, remote_disk_o_direct: true, gds_threads: 16, runtime_threads: 128 }
  - { remote_disk_backend: gds, remote_disk_o_direct: true, gds_threads: 32, runtime_threads: 128 }
  - { remote_disk_backend: gds, remote_disk_o_direct: true, gds_threads: 64, runtime_threads: 128 }
  - { remote_disk_backend: gds, remote_disk_o_direct: true, gds_threads: 128, runtime_threads: 128 }
