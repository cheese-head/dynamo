#
# 4x TP1 GPT-OSS 120B with shared-disk KVBM.
# Each vLLM worker gets a single GPU; the frontend runs as a separate service.
#
# Usage:
#   docker compose \
#     --env-file examples/kvbm/distributed/.env-distributed-disk-4x-tp1 \
#     -f examples/kvbm/distributed/docker-compose.disk-4x-tp1.yml \
#     up -d
#
# GPU assignment:
#   Workers 0-3 map to GPU 0-3 by default. Override with WORKER_0_GPU, WORKER_1_GPU, etc.
#
# See docker-compose.disk.yml header for the full list of toggleable env vars.

x-common-worker: &common-worker
  image: ${DYNAMO_IMAGE:-gtc-demo-vllm-local-dev:latest}
  user: "0"
  volumes:
    - ${WORKSPACE_HOST_PATH:-../../..}:/workspace
    - ${HF_HOME:-${HOME}/.cache/huggingface}:/opt/models
    - /dev/hugepages:/dev/hugepages
    - /dev/infiniband:/dev/infiniband
    - ${KVBM_REMOTE_DISK_HOST_PATH:-/tmp/disk-kvcache}:${KVBM_REMOTE_DISK_CONTAINER_PATH:-/tmp/disk-kvcache}
  ulimits:
    memlock:
      soft: -1
      hard: -1
  working_dir: /workspace/examples/backends/vllm
  environment: &common-env
    DYN_LOG: ${DYN_LOG:-debug}
    MODEL: ${MODEL:-openai/gpt-oss-120b}
    ENABLE_PREFIX_CACHING: ${ENABLE_PREFIX_CACHING:-false}
    GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.9}
    TP_SIZE: "1"
    VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
    HF_HOME: /opt/models
    HF_TOKEN: ${HF_TOKEN:-}
    HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    DYN_STORE_KV: etcd
    DYN_REQUEST_PLANE: tcp
    ETCD_ENDPOINTS: http://etcd-server:2379
    NATS_SERVER: nats://nats-server:4222
    DYN_REGISTRY_ENABLE: "1"
    DYN_REGISTRY_CLIENT_QUERY_ADDR: tcp://registry:5555
    DYN_REGISTRY_CLIENT_REGISTER_ADDR: tcp://registry:5556
    KVBM_DEV_MODE: ${KVBM_DEV_MODE:-}
    DYN_KVBM_CPU_CACHE_GB: ${DYN_KVBM_CPU_CACHE_GB:-100}
    DYN_KVBM_REMOTE_STORAGE_TYPE: disk
    DYN_KVBM_REMOTE_DISK_PATHS: ${KVBM_REMOTE_DISK_PATHS:-/tmp/disk-kvcache}
    DYN_KVBM_REMOTE_DISK_USE_GDS: ${DYN_KVBM_REMOTE_DISK_USE_GDS:-0}
    DYN_KVBM_DISK_ZEROFILL_FALLBACK: ${DYN_KVBM_DISK_ZEROFILL_FALLBACK:-true}
    DYN_KVBM_REMOTE_DISK_O_DIRECT: ${DYN_KVBM_REMOTE_DISK_O_DIRECT:-true}
  depends_on:
    nats-server:
      condition: service_started
    etcd-server:
      condition: service_healthy
    registry:
      condition: service_started
  networks:
    - kvbm
  command:
    - bash
    - -c
    - |
      set -e
      echo "=== Rebuilding KVBM wheel from workspace source ==="
      cd /workspace/lib/bindings/kvbm
      maturin build --profile release --out /workspace/dist
      uv pip install --upgrade --force-reinstall --no-deps /workspace/dist/*.whl
      echo "=== KVBM wheel rebuilt and installed ==="
      cd /workspace/examples/backends/vllm

      PREFIX_FLAG=""
      if [ "$${ENABLE_PREFIX_CACHING}" = "false" ] || [ "$${ENABLE_PREFIX_CACHING}" = "0" ]; then
        PREFIX_FLAG="--no-enable-prefix-caching"
        echo "=== Prefix caching: DISABLED ==="
      else
        PREFIX_FLAG="--enable-prefix-caching"
        echo "=== Prefix caching: ENABLED ==="
      fi

      exec python3 -m dynamo.vllm \
        --model "$${MODEL}" \
        --tensor-parallel-size "$${TP_SIZE}" \
        --connector kvbm \
        --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION}" \
        $${PREFIX_FLAG} \
        $${VLLM_EXTRA_ARGS}

networks:
  kvbm:
    driver: bridge

services:
  # ── shared infrastructure ──────────────────────────────────────────────
  nats-server:
    image: nats:2.11.4
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
    networks:
      - kvbm

  etcd-server:
    image: bitnamilegacy/etcd:3.6.1
    environment:
      ALLOW_NONE_AUTHENTICATION: yes
    networks:
      - kvbm
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  registry:
    image: ${DYNAMO_IMAGE:-gtc-demo-vllm-local-dev:latest}
    volumes:
      - ${WORKSPACE_HOST_PATH:-../../..}:/workspace
    working_dir: /workspace
    command:
      - bash
      - -c
      - |
        cd /workspace/examples/kvbm/distributed/sample-registry && \
        cargo build --release && \
        exec /workspace/target/release/registry
    environment:
      DYN_REGISTRY_HUB_QUERY_ADDR: tcp://0.0.0.0:5555
      DYN_REGISTRY_HUB_REGISTER_ADDR: tcp://0.0.0.0:5556
      DYN_REGISTRY_HUB_CAPACITY: "1000000"
      RUST_LOG: "${REGISTRY_LOG:-dynamo_llm::block_manager::distributed::registry=info,registry=info}"
    ports:
      - "5555:5555"
      - "5556:5556"
    networks:
      - kvbm

  # ── frontend (round-robin router) ─────────────────────────────────────
  frontend:
    image: ${DYNAMO_IMAGE:-gtc-demo-vllm-local-dev:latest}
    user: "0"
    volumes:
      - ${WORKSPACE_HOST_PATH:-../../..}:/workspace
    working_dir: /workspace/examples/backends/vllm
    environment:
      DYN_LOG: ${DYN_LOG:-debug}
      DYN_STORE_KV: etcd
      DYN_REQUEST_PLANE: tcp
      ETCD_ENDPOINTS: http://etcd-server:2379
      NATS_SERVER: nats://nats-server:4222
    depends_on:
      nats-server:
        condition: service_started
      etcd-server:
        condition: service_healthy
    networks:
      - kvbm
    ports:
      - "8000:8000"
    command:
      - bash
      - -c
      - |
        exec python3 -m dynamo.frontend --router-mode round-robin --http-port 8000

  # ── vLLM workers (4x TP1, one GPU each) ───────────────────────────────
  dynamo-kvbm-0:
    <<: *common-worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${WORKER_0_GPU:-0}"]
              capabilities: [gpu]
    environment:
      <<: *common-env
      KVBM_MANAGEMENT_PORT: "6881"
    ports:
      - "6881:6881"

  dynamo-kvbm-1:
    <<: *common-worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${WORKER_1_GPU:-1}"]
              capabilities: [gpu]
    environment:
      <<: *common-env
      KVBM_MANAGEMENT_PORT: "6882"
    ports:
      - "6882:6882"

  dynamo-kvbm-2:
    <<: *common-worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${WORKER_2_GPU:-2}"]
              capabilities: [gpu]
    environment:
      <<: *common-env
      KVBM_MANAGEMENT_PORT: "6883"
    ports:
      - "6883:6883"

  dynamo-kvbm-3:
    <<: *common-worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${WORKER_3_GPU:-3}"]
              capabilities: [gpu]
    environment:
      <<: *common-env
      KVBM_MANAGEMENT_PORT: "6884"
    ports:
      - "6884:6884"
