#
# Development environment for KVBM distributed work.
# Starts shared infra plus a long-lived workspace container, but does not launch vLLM.
#
# Usage:
#   docker compose \
#     --env-file examples/kvbm/distributed/.env-distributed-disk \
#     -f examples/kvbm/distributed/docker-compose.dev.yml \
#     up -d
#
# Enter the dev container:
#   docker compose -f examples/kvbm/distributed/docker-compose.dev.yml exec dynamo-dev bash
#
# Typical commands inside the container:
#   cd /workspace/lib/bindings/kvbm
#   maturin build --profile dev
#   cargo test -p dynamo-llm block_manager::connector::scheduler::tests -- --nocapture

networks:
  kvbm:
    driver: bridge

services:
  nats-server:
    image: nats:2.11.4
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
    networks:
      - kvbm

  etcd-server:
    image: bitnamilegacy/etcd:3.6.1
    environment:
      ALLOW_NONE_AUTHENTICATION: yes
    networks:
      - kvbm
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  registry:
    image: ${DYNAMO_IMAGE:-gtc-demo-vllm-local-dev:latest}
    volumes:
      - ${WORKSPACE_HOST_PATH:-../../..}:/workspace
    working_dir: /workspace
    command:
      - bash
      - -c
      - |
        cd /workspace/examples/kvbm/distributed/sample-registry && \
        cargo build --release && \
        exec /workspace/target/release/registry
    environment:
      DYN_REGISTRY_HUB_QUERY_ADDR: tcp://0.0.0.0:5555
      DYN_REGISTRY_HUB_REGISTER_ADDR: tcp://0.0.0.0:5556
      DYN_REGISTRY_HUB_CAPACITY: "1000000"
      RUST_LOG: "${REGISTRY_LOG:-dynamo_llm::block_manager::distributed::registry=debug,registry=debug}"
    ports:
      - "5555:5555"
      - "5556:5556"
    networks:
      - kvbm

  dynamo-dev:
    image: ${DYNAMO_IMAGE:-gtc-demo-vllm-local-dev:latest}
    user: "0"
    volumes:
      - ${WORKSPACE_HOST_PATH:-../../..}:/workspace
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/opt/models
      - /dev/hugepages:/dev/hugepages
      - /dev/infiniband:/dev/infiniband
      - ${KVBM_REMOTE_DISK_HOST_PATH:-/tmp/disk-kvcache}:${KVBM_REMOTE_DISK_CONTAINER_PATH:-/tmp/disk-kvcache}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    working_dir: /workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${TP_SIZE:-1}
              capabilities: [gpu]
    environment:
      DYN_LOG: ${DYN_LOG:-debug}
      MODEL: ${MODEL:-openai/gpt-oss-120b}
      ENABLE_PREFIX_CACHING: ${ENABLE_PREFIX_CACHING:-false}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.9}
      TP_SIZE: ${TP_SIZE:-1}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
      HF_HOME: /opt/models
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      DYN_STORE_KV: etcd
      DYN_REQUEST_PLANE: tcp
      ETCD_ENDPOINTS: http://etcd-server:2379
      NATS_SERVER: nats://nats-server:4222
      DYN_REGISTRY_ENABLE: "1"
      DYN_REGISTRY_CLIENT_QUERY_ADDR: tcp://registry:5555
      DYN_REGISTRY_CLIENT_REGISTER_ADDR: tcp://registry:5556
      KVBM_DEV_MODE: ${KVBM_DEV_MODE:-TRUE}
      KVBM_MANAGEMENT_PORT: ${KVBM_MANAGEMENT_PORT:-6881}
      DYN_KVBM_CPU_CACHE_GB: ${DYN_KVBM_CPU_CACHE_GB:-500}
      DYN_KVBM_DISK_CACHE_GB: ${DYN_KVBM_DISK_CACHE_GB:-}
      DYN_KVBM_REMOTE_STORAGE_TYPE: disk
      DYN_KVBM_REMOTE_DISK_PATHS: ${KVBM_REMOTE_DISK_PATHS:-/mnt/pure/kvbm-{worker_id}}
      DYN_KVBM_REMOTE_DISK_USE_GDS: ${DYN_KVBM_REMOTE_DISK_USE_GDS:-0}
      DYN_KVBM_DISK_ZEROFILL_FALLBACK: ${DYN_KVBM_DISK_ZEROFILL_FALLBACK:-true}
      DYN_KVBM_DISK_DISABLE_O_DIRECT: ${DYN_KVBM_DISK_DISABLE_O_DIRECT:-true}
    depends_on:
      nats-server:
        condition: service_started
      etcd-server:
        condition: service_healthy
      registry:
        condition: service_started
    networks:
      - kvbm
    ports:
      - "6881:6881"
    command:
      - bash
      - -c
      - |
        echo "Dev container ready. Attach with: docker compose exec dynamo-dev bash"
        exec sleep infinity
