#
# 1× TP1 — one vLLM+KVBM worker on a single GPU (shared-disk KVBM).
# Same images, env, and startup scripts as docker-compose.disk-4x-tp1.yml, but only
# dynamo-kvbm-0 is defined. Use this on one-GPU machines instead of starting workers
# 1–7 by mistake.
#
# Usage:
#   docker compose \
#     --env-file examples/kvbm/distributed/.env-distributed-disk-1x-tp1 \
#     -f examples/kvbm/distributed/docker-compose.disk-1x-tp1.yml \
#     up -d
#
#   docker compose \
#     --env-file examples/kvbm/distributed/.env-distributed-disk-1x-tp1 \
#     -f examples/kvbm/distributed/docker-compose.disk-1x-tp1.yml \
#     down
#
# GPU: WORKER_0_GPU (default 0) sets CUDA_VISIBLE_DEVICES inside the container.
# Compose reserves count: 1 NVIDIA device for dynamo-kvbm-0.
#
# For multi-GPU setups, use docker-compose.disk-4x-tp1.yml instead.
#
# See docker-compose.disk-4x-tp1.yml header for OTEL, vLLM pin, and other toggles.
#
# Worker bind mounts are anchored so each service can repeat `volumes: *kvbm-worker-volumes`.
# (Relying only on `<<: *common-worker` for volumes can drop the KV disk bind in some Compose versions.)

x-kvbm-worker-volumes: &kvbm-worker-volumes
  - ${WORKSPACE_HOST_PATH:-../../..}:/workspace
  - ${HF_HOME:-${HOME}/.cache/huggingface}:/opt/models
  - /dev/hugepages:/dev/hugepages
  - /dev/infiniband:/dev/infiniband
  - ${KVBM_REMOTE_DISK_HOST_PATH:-/tmp/disk-kvcache}:${KVBM_REMOTE_DISK_CONTAINER_PATH:-/tmp/disk-kvcache}

x-common-worker: &common-worker
  image: ${DYNAMO_IMAGE:-gtc-demo-vllm-local-dev:latest}
  user: "0"
  privileged: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: json-file
    options:
      labels: "otel_service_name"
  volumes: *kvbm-worker-volumes
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:$${KVBM_MANAGEMENT_PORT:-6881}/v1/cache/status | python3 -c 'import sys,json; d=json.load(sys.stdin); pools=d.get(\"pools\",{}); assert any(p.get(\"total_blocks\",0)>0 for p in pools.values())'"]
    interval: 10s
    timeout: 10s
    retries: 60
    start_period: 120s
  init: true
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 1048576
      hard: 1048576
    core:
      soft: -1
      hard: -1
  working_dir: /workspace/examples/backends/vllm
  environment: &common-env
    # RUST_BACKTRACE: "full"
    # NCCL_DEBUG: "WARN"
    # PYTHONFAULTHANDLER: "1"
    # CUDA_LAUNCH_BLOCKING: "0"
    # TORCH_SHOW_CPP_STACKTRACES: "1"
    # TORCH_CPP_LOG_LEVEL: "WARNING"
    # PYTHONMALLOC: "malloc"
    DYN_LOG: ${DYN_LOG:-info}
    MODEL: ${MODEL:-openai/gpt-oss-120b}
    ENABLE_PREFIX_CACHING: ${ENABLE_PREFIX_CACHING:-false}
    GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.9}
    TP_SIZE: "${TP_SIZE:-1}"
    VLLM_VERSION: ${VLLM_VERSION:-0.18.0}
    DYNAMO_PYTHON: ${DYNAMO_PYTHON:-/opt/dynamo/venv/bin/python3}
    VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
    HF_HOME: /opt/models
    HF_TOKEN: ${HF_TOKEN:-}
    HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    DYN_STORE_KV: etcd
    DYN_REQUEST_PLANE: tcp
    ETCD_ENDPOINTS: http://etcd-server:2379
    NATS_SERVER: nats://nats-server:4222
    DYN_REGISTRY_ENABLE: "1"
    DYN_REGISTRY_CLIENT_QUERY_ADDR: tcp://registry:5555
    DYN_REGISTRY_CLIENT_REGISTER_ADDR: tcp://registry:5556
    KVBM_DEV_MODE: ${KVBM_DEV_MODE:-}
    DYN_KVBM_CPU_CACHE_GB: ${DYN_KVBM_CPU_CACHE_GB:-62}
    DYN_KVBM_DISK_CACHE_GB: ${DYN_KVBM_DISK_CACHE_GB:-}
    DYN_KVBM_REMOTE_STORAGE_TYPE: disk
    DYN_KVBM_REMOTE_DISK_PATHS: ${KVBM_REMOTE_DISK_PATHS:-/tmp/disk-kvcache}
    DYN_KVBM_REMOTE_DISK_USE_GDS: ${DYN_KVBM_REMOTE_DISK_USE_GDS:-0}
    DYN_KVBM_DISK_ZEROFILL_FALLBACK: ${DYN_KVBM_DISK_ZEROFILL_FALLBACK:-true}
    DYN_KVBM_REMOTE_DISK_O_DIRECT: ${DYN_KVBM_REMOTE_DISK_O_DIRECT:-true}
    DYN_KVBM_TRANSFER_BATCH_SIZE: ${DYN_KVBM_TRANSFER_BATCH_SIZE:-}
    DYN_KVBM_MAX_CONCURRENT_TRANSFERS: ${DYN_KVBM_MAX_CONCURRENT_TRANSFERS:-}
    DYN_KVBM_FLUSH_BATCH_SIZE: ${DYN_KVBM_FLUSH_BATCH_SIZE:-}
    DYN_KVBM_G4_PIPELINE_CHUNK_SIZE: ${DYN_KVBM_G4_PIPELINE_CHUNK_SIZE:-}
    DYN_KVBM_G4_TRANSFER_TIMEOUT_SECS: ${DYN_KVBM_G4_TRANSFER_TIMEOUT_SECS:-}
    DYN_KVBM_PREFETCH_TIMEOUT_SECS: ${DYN_KVBM_PREFETCH_TIMEOUT_SECS:-10}
    DYN_KVBM_METRICS: ${DYN_KVBM_METRICS:-}
    DYN_KVBM_METRICS_PORT: ${DYN_KVBM_METRICS_PORT:-6880}
    OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
    DYN_LOGGING_JSONL: ${DYN_LOGGING_JSONL:-}
    NIXL_PLUGIN_DIR: ${NIXL_PLUGIN_DIR:-/opt/nvidia/nvda_nixl/lib/x86_64-linux-gnu/plugins}
  depends_on:
    nats-server:
      condition: service_started
    etcd-server:
      condition: service_healthy
    registry:
      condition: service_started
  networks:
    - kvbm
  command:
    - bash
    - -c
    - |
      set -e
      if command -v git >/dev/null 2>&1 && [ -e /workspace/.git ]; then
        git config --global --add safe.directory /workspace 2>/dev/null || true
        GIT_REV="$$(git -C /workspace rev-parse --short HEAD 2>/dev/null || echo unknown)"
        GIT_BRANCH="$$(git -C /workspace rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
        GIT_STATUS="$$(git -C /workspace status --porcelain 2>/dev/null | head -1)"
        if [ -n "$$GIT_STATUS" ]; then DIRTY=" dirty"; else DIRTY=""; fi
        echo "=== Workspace git: branch=$$GIT_BRANCH commit=$$GIT_REV$$DIRTY ==="
        export WORKSPACE_GIT_REV="$$GIT_REV"
        export WORKSPACE_GIT_BRANCH="$$GIT_BRANCH"
      else
        echo "=== Workspace git: unavailable (no .git or git missing) ==="
        export WORKSPACE_GIT_REV="unknown"
        export WORKSPACE_GIT_BRANCH="unknown"
      fi
      VLLM_VER="$${VLLM_VERSION:-0.18.0}"
      VENV_PY="$${DYNAMO_PYTHON:-/opt/dynamo/venv/bin/python3}"
      echo "=== Python for uv + vLLM: $$VENV_PY ($$($$VENV_PY -c 'import sys; print(sys.version.split()[0])')) ==="
      if [ -n "$${WORKER_GPU_INDEX:-}" ]; then
        echo "=== Pinning to GPU $${WORKER_GPU_INDEX} ==="
        export CUDA_VISIBLE_DEVICES=$${WORKER_GPU_INDEX}
      else
        echo "=== All GPUs visible (TP=$${TP_SIZE:-1}) ==="
      fi
      mkdir -p /workspace/dist
      echo "=== Ensuring vLLM $$VLLM_VER + KVBM wheel (shared flock) ==="
      (
        flock -x 9
        echo "=== uv pip install --upgrade vllm[flashinfer,runai]==$$VLLM_VER (image may bundle older vLLM) ==="
        uv pip install --python "$$VENV_PY" --upgrade "vllm[flashinfer,runai]==$$VLLM_VER"
        "$$VENV_PY" -c "import vllm; print('=== vLLM runtime version (import):', vllm.__version__)"
        FI_VER=$$("$$VENV_PY" -c 'import importlib.metadata as m; print(m.version("flashinfer-python"))' 2>/dev/null || true)
        FI_CUDA_TAG=$${FLASHINFER_JIT_CACHE_CUDA:-cu129}
        if [ -n "$$FI_VER" ]; then
          echo "=== uv pip install flashinfer-cubin + flashinfer-jit-cache ($$FI_VER / $$FI_CUDA_TAG) ==="
          uv pip install --python "$$VENV_PY" --upgrade \
            "flashinfer-cubin==$$FI_VER" \
            --extra-index-url "https://flashinfer.ai/whl/$$FI_CUDA_TAG" \
            "flashinfer-jit-cache==$$FI_VER+$$FI_CUDA_TAG"
        fi
        if [ ! -f /workspace/dist/.kvbm-built ]; then
          echo "=== maturin build KVBM (release) -> /workspace/dist ==="
          cd /workspace/lib/bindings/kvbm
          maturin build --profile release --out /workspace/dist
          touch /workspace/dist/.kvbm-built
        else
          echo "=== KVBM wheel already built (.kvbm-built present) ==="
        fi
      ) 9>/workspace/dist/.build-lock
      uv pip install --python "$$VENV_PY" --upgrade --force-reinstall --no-deps /workspace/dist/*.whl
      echo "=== KVBM wheel installed ==="
      cd /workspace/examples/backends/vllm

      PREFIX_FLAG=""
      if [ "$${ENABLE_PREFIX_CACHING}" = "false" ] || [ "$${ENABLE_PREFIX_CACHING}" = "0" ]; then
        PREFIX_FLAG="--no-enable-prefix-caching"
        echo "=== Prefix caching: DISABLED ==="
      else
        PREFIX_FLAG="--enable-prefix-caching"
        echo "=== Prefix caching: ENABLED ==="
      fi

      OTLP_FLAG=""
      if [ -n "$${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}" ] && [ "$${OTEL_EXPORT_ENABLED}" = "1" ]; then
        OTLP_FLAG="--otlp-traces-endpoint $${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}"
        echo "=== vLLM OTEL tracing: ENABLED (endpoint=$${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}) ==="
      else
        echo "=== vLLM OTEL tracing: DISABLED ==="
      fi

      exec "$$VENV_PY" -m dynamo.vllm \
        --model "$${MODEL}" \
        --tensor-parallel-size "$${TP_SIZE}" \
        --connector kvbm \
        --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION}" \
        $${PREFIX_FLAG} \
        $${OTLP_FLAG} \
        $${VLLM_EXTRA_ARGS}

networks:
  kvbm:
    driver: bridge

volumes:
  otel-log-checkpoint:

services:
  otel-log-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    user: "0"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./otel-log-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-log-checkpoint:/var/otel/checkpoint
    networks:
      - kvbm

  nats-server:
    image: nats:2.11.4
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
    networks:
      - kvbm

  etcd-server:
    image: bitnamilegacy/etcd:3.6.1
    environment:
      ALLOW_NONE_AUTHENTICATION: yes
    networks:
      - kvbm
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  registry:
    image: ${DYNAMO_IMAGE:-gtc-demo-vllm-local-dev:latest}
    labels:
      otel_service_name: dynamo-registry
    logging:
      driver: json-file
      options:
        labels: "otel_service_name"
    volumes:
      - ${WORKSPACE_HOST_PATH:-../../..}:/workspace
    working_dir: /workspace
    command:
      - bash
      - -c
      - |
        if command -v git >/dev/null 2>&1 && [ -e /workspace/.git ]; then
          git config --global --add safe.directory /workspace 2>/dev/null || true
          echo "=== Workspace git: branch=$$(git -C /workspace rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown) commit=$$(git -C /workspace rev-parse --short HEAD 2>/dev/null || echo unknown) ==="
        else
          echo "=== Workspace git: unavailable ==="
        fi
        cd /workspace/examples/kvbm/distributed/sample-registry && \
        cargo build --release && \
        exec /workspace/target/release/registry
    environment:
      DYN_REGISTRY_HUB_QUERY_ADDR: tcp://0.0.0.0:5555
      DYN_REGISTRY_HUB_REGISTER_ADDR: tcp://0.0.0.0:5556
      DYN_REGISTRY_HUB_CAPACITY: "1000000"
      RUST_LOG: "${REGISTRY_LOG:-dynamo_llm::block_manager::distributed::registry=info,registry=info}"
    ports:
      - "5555:5555"
      - "5556:5556"
    networks:
      - kvbm

  frontend:
    image: ${DYNAMO_IMAGE:-gtc-demo-vllm-local-dev:latest}
    user: "0"
    labels:
      otel_service_name: dynamo-frontend
    logging:
      driver: json-file
      options:
        labels: "otel_service_name"
    volumes:
      - ${WORKSPACE_HOST_PATH:-../../..}:/workspace
    working_dir: /workspace/examples/backends/vllm
    environment:
      DYN_LOG: ${DYN_LOG:-debug}
      DYN_STORE_KV: etcd
      DYN_REQUEST_PLANE: tcp
      ETCD_ENDPOINTS: http://etcd-server:2379
      NATS_SERVER: nats://nats-server:4222
    depends_on:
      nats-server:
        condition: service_started
      etcd-server:
        condition: service_healthy
    networks:
      - kvbm
    ports:
      - "8000:8000"
    command:
      - bash
      - -c
      - |
        if command -v git >/dev/null 2>&1 && [ -e /workspace/.git ]; then
          git config --global --add safe.directory /workspace 2>/dev/null || true
          GIT_REV="$$(git -C /workspace rev-parse --short HEAD 2>/dev/null || echo unknown)"
          GIT_BRANCH="$$(git -C /workspace rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
          GIT_STATUS="$$(git -C /workspace status --porcelain 2>/dev/null | head -1)"
          if [ -n "$$GIT_STATUS" ]; then DIRTY=" dirty"; else DIRTY=""; fi
          echo "=== Workspace git: branch=$$GIT_BRANCH commit=$$GIT_REV$$DIRTY ==="
        else
          echo "=== Workspace git: unavailable (no .git or git missing) ==="
        fi
        exec python3 -m dynamo.frontend --router-mode kv --http-port 8000

  dynamo-kvbm-0:
    <<: *common-worker
    volumes: *kvbm-worker-volumes
    labels:
      otel_service_name: dynamo-kvbm-0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: dynamo-kvbm-0
      KVBM_MANAGEMENT_PORT: "6881"
      DYN_KVBM_METRICS_PORT: "6880"
      WORKER_GPU_INDEX: "${WORKER_0_GPU:-}"
    ports:
      - "6881:6881"
      - "6880:6880"
